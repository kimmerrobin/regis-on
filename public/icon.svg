<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1644"/>
      <stop offset="50%" stop-color="#2a1f63"/>
      <stop offset="100%" stop-color="#140f2b"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Logo Shape: Hexagon / Shield with Checkmark -->
  <g filter="url(#glow)">
    <!-- Rounded Check Circle / Badge -->
    <rect x="96" y="96" width="320" height="320" rx="80" fill="url(#checkGrad)"/>
    
    <!-- White Checkmark -->
    <path d="M180 260 L235 315 L335 195" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Subtle Bio Dots in corners -->
  <circle cx="130" cy="130" r="10" fill="#c084fc" opacity="0.6"/>
  <circle cx="382" cy="130" r="10" fill="#818cf8" opacity="0.6"/>
  <circle cx="130" cy="382" r="10" fill="#818cf8" opacity="0.6"/>
  <circle cx="382" cy="382" r="10" fill="#c084fc" opacity="0.6"/>
</svg>
